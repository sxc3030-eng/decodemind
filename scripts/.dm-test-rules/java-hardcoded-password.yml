id: java-hardcoded-password
language: Java
category: security
severity: error
message: Hardcoded password or secret literal — move credentials to environment
  variables or a secrets manager
rule:
  pattern: String $VAR = $VALUE
constraints:
  VAR:
    regex: (?i)(password|passwd|secret|apikey|api_key|token)
  VALUE:
    regex: ^"[^"]{4,}"$
