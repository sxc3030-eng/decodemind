id: crypto-hardcoded-secret
language: Python
category: security
severity: error
message: Hardcoded secret or API key detected — move credentials to environment
  variables or a secrets manager
rule:
  pattern: $VAR = $VALUE
constraints:
  VAR:
    regex: (?i)(SECRET|KEY|TOKEN|PASSWORD)
  VALUE:
    regex: ^"[^"]{8,}"$
