id: quality-long-function
language: Python
category: quality
severity: info
message: Function has many lines — consider splitting
rule:
  pattern: |
    def $FN($$$PARAMS):
      $$$BODY
# TODO: ast-grep pattern matching cannot count lines. This matches every function.
# Use a post-filter on $$$BODY line count to enforce a threshold (e.g. > 50 lines).
