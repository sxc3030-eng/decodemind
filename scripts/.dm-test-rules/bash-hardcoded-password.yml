id: bash-hardcoded-password
language: Bash
category: security
severity: error
message: Hardcoded credential in a shell script — move to a secrets manager or environment loaded outside the repo
rule:
  pattern: $VAR=$VALUE
constraints:
  VAR:
    regex: '^(?i)(password|passwd|pwd|secret|api_key|apikey|token|access_key)$'
  VALUE:
    regex: '^"[^"]{3,}"$|^''[^'']{3,}''$|^[A-Za-z0-9_!@#$%^&*\-]{6,}$'
