id: csharp-hardcoded-password
language: C#
category: security
severity: error
message: Hardcoded password or secret literal — move credentials to environment variables, user-secrets, or Azure Key Vault
rule:
  pattern: string $VAR = $VALUE
  constraints:
    VAR:
      regex: '(?i)(password|passwd|secret|apikey|api_key|token|connectionstring)'
    VALUE:
      regex: '^"[^"]{4,}"$'
