id: bug-string-concat-int
language: Python
category: bug
severity: error
message: Implicit string + int concatenation will TypeError
rule:
  kind: binary_operator
  pattern: $STR + $NUM
constraints:
  STR:
    regex: '^".*"$|^''.*''$'
  NUM:
    regex: '^[0-9]+$'
# Narrowed: STR must be a literal string ("..." or '...'), NUM must be an integer
# literal. Without these constraints the rule would flag every binary `+` in
# the file. ast-grep needs `kind: binary_operator` to disambiguate the pattern.
