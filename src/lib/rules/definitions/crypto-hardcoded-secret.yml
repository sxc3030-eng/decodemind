id: crypto-hardcoded-secret
language: Python
category: security
severity: error
message: Hardcoded secret or API key detected — move credentials to environment variables or a secrets manager
rule:
  any:
    - pattern: API_KEY = $_
    - pattern: API_TOKEN = $_
    - pattern: ACCESS_TOKEN = $_
    - pattern: AUTH_TOKEN = $_
    - pattern: SECRET = $_
    - pattern: SECRET_KEY = $_
    - pattern: PASSWORD = $_
    - pattern: PRIVATE_KEY = $_
    - pattern: api_key = $_
    - pattern: api_token = $_
    - pattern: secret_key = $_
    - pattern: access_token = $_
# Enumerated common credential identifier names to avoid the
# `Undefined meta var` constraint bug in @ast-grep/wasm 0.42. CLI parses
# `pattern + constraints` correctly but the WASM runtime drops meta-var
# bindings before evaluating constraints. The `any: [concrete patterns]`
# form sidesteps that entirely.
