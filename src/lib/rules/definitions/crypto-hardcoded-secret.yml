id: crypto-hardcoded-secret
language: Python
category: security
severity: error
message: Hardcoded secret or API key detected — move credentials to environment variables or a secrets manager
rule:
  all:
    - kind: assignment
    - pattern: $VAR = $VALUE
constraints:
  VAR:
    regex: '(?i)(SECRET|KEY|TOKEN|PASSWORD|PASSWD|API[_]?KEY)'
  VALUE:
    regex: '^"[^"]{8,}"$|^''[^'']{8,}''$'
# `all: [{kind}, {pattern}]` form keeps meta-vars bound for constraints
# (context/selector form silently drops them in the WASM runtime).
