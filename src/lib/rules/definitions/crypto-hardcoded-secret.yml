id: crypto-hardcoded-secret
language: Python
category: security
severity: error
message: Hardcoded secret or API key detected — move credentials to environment variables or a secrets manager
rule:
  pattern:
    context: $VAR = $VALUE
    selector: assignment
constraints:
  VAR:
    regex: '(?i)(SECRET|KEY|TOKEN|PASSWORD|PASSWD|API[_]?KEY)'
  VALUE:
    regex: '^"[^"]{8,}"$|^''[^'']{8,}''$'
# The `context + selector` form disambiguates the pattern so ast-grep treats
# it as an assignment statement. Constraints restrict the meta-vars to
# (a) identifier names mentioning a credential keyword, and (b) string
# literals of at least 8 chars.
