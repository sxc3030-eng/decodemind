id: crypto-hardcoded-secret
language: Python
category: security
severity: error
message: Hardcoded secret or API key detected — move credentials to environment variables or a secrets manager
rule:
  kind: assignment
  pattern: $VAR = $VALUE
constraints:
  VAR:
    regex: '(?i)(SECRET|KEY|TOKEN|PASSWORD|PASSWD|API[_]?KEY)'
  VALUE:
    regex: '^"[^"]{8,}"$|^''[^'']{8,}''$'
# `kind: assignment` is required so ast-grep treats this as the assignment-
# statement matcher, not a general `=` expression. The constraints restrict
# the meta-vars to (a) identifier names mentioning a credential keyword, and
# (b) string literals of at least 8 chars (excludes empty placeholders).
