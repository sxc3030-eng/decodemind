id: quality-todo-comment
language: JavaScript
category: quality
severity: info
message: TODO comment found — track outside source if not actionable
rule:
  kind: comment
  regex: 'TODO|FIXME|XXX'
# ast-grep CAN match comments — use `kind: comment` + a regex on the
# comment text. The previous `pattern: $ANY` was a no-op placeholder
# that ast-grep rejects with "Multiple AST nodes detected".
