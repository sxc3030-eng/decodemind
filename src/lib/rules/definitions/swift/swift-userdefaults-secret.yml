id: swift-userdefaults-secret
language: Swift
category: security
severity: error
message: Storing credentials in UserDefaults — values are in plaintext on disk; use Keychain instead
rule:
  pattern: UserDefaults.standard.set($V, forKey: $KEY)
  constraints:
    KEY:
      regex: '(?i)"(password|token|apikey|api_key|secret|credential|auth)'
