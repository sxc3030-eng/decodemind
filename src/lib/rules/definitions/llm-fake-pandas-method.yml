id: llm-fake-pandas-method
language: Python
category: bug
severity: error
message: This pandas method does not exist — common LLM hallucination
rule:
  kind: call
  regex: 'read_excel_advanced|to_clean_csv|drop_duplicates_inplace|smart_merge|fast_concat'
# `kind: call` + `regex:` on the call's source text. Avoids the meta-var
# receiver (`$DF.method`) that the WASM runtime can't disambiguate.
# Reviewers should confirm the call is on a DataFrame (vs unrelated method
# names that happen to share the spelling).
