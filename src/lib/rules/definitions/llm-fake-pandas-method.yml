id: llm-fake-pandas-method
language: Python
category: bug
severity: error
message: This pandas method does not exist — common LLM hallucination
rule:
  any:
    - pattern: $DF.read_excel_advanced($$$)
    - pattern: $DF.to_clean_csv($$$)
    - pattern: $DF.drop_duplicates_inplace($$$)
    - pattern: $DF.smart_merge($$$)
    - pattern: $DF.fast_concat($$$)
# Enumerated the fake-method names in `any:` (each pattern concrete-anchored
# on the method name) instead of constraining `$METHOD` via regex. Avoids
# the WASM meta-var binding drop.
