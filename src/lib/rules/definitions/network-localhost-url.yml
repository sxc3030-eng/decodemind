id: network-localhost-url
language: Python
category: bug
severity: warning
message: Hardcoded localhost / 127.0.0.1 URL — will break in production; move to a config value or environment variable
rule:
  any:
    # localhost
    - pattern: requests.get("http://localhost")
    - pattern: requests.post("http://localhost")
    - pattern: requests.put("http://localhost")
    - pattern: requests.delete("http://localhost")
    # localhost with port — enumerate common dev ports
    - pattern: requests.get("http://localhost:3000")
    - pattern: requests.get("http://localhost:5000")
    - pattern: requests.get("http://localhost:8000")
    - pattern: requests.get("http://localhost:8080")
    - pattern: requests.get("http://localhost:9999")
    # 127.0.0.1
    - pattern: requests.get("http://127.0.0.1")
    - pattern: requests.post("http://127.0.0.1")
    # kind+regex catch-all for the URL string itself
    - kind: string
      regex: '^"http://(localhost|127\.0\.0\.1|0\.0\.0\.0)'
# WASM ast-grep can't bind meta-vars in patterns + apply regex constraints,
# so enumerate common request-method/localhost combinations + add a
# string-level regex matcher as a catch-all. The string regex matches ANY
# string literal containing a localhost URL — broader, but reviewers can
# confirm it's used in a network call from context.
