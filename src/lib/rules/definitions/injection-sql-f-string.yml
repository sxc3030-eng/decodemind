id: injection-sql-f-string
language: Python
category: security
severity: error
message: f-string SQL query — user input is interpolated directly into SQL; use parameterized queries instead
rule:
  any:
    - all:
        - kind: call
        - pattern: cursor.execute(f"$$$")
    - all:
        - kind: call
        - pattern: $CUR.execute(f"$$$")
    - all:
        - kind: call
        - pattern: $CUR.executemany(f"$$$")
    - all:
        - kind: assignment
        - pattern: $VAR = f"$$$"
constraints:
  VAR:
    regex: '(?i)(query|sql|stmt|statement)'
