id: bug-dict-get-no-default
language: Python
category: bug
severity: info
message: dict.get() without default returns None — caller may not handle it
rule:
  kind: call
  has:
    field: function
    kind: attribute
    has:
      field: attribute
      regex: '^get$'
# Structured `kind: call` + nested `has` matcher avoids the context/selector
# form that hangs the ast-grep WASM runtime for 5+ minutes (CLI works fine).
# This catches every `.get(...)` call — broad on purpose so reviewers can
# confirm whether the call is on a dict (vs requests.get, etc.).
