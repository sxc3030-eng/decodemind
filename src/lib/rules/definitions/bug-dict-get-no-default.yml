id: bug-dict-get-no-default
language: Python
category: bug
severity: info
message: dict.get() without default returns None — caller may not handle it
rule:
  all:
    - kind: call
    - pattern: $DICT.get($KEY)
# `all: [{kind}, {pattern}]` form: kind narrows to call nodes, pattern provides
# meta-var bindings without the WASM hang of the context/selector form.
