id: dart-shared-prefs-secret
language: Dart
category: security
severity: error
message: Storing credentials in SharedPreferences — values are in plaintext on disk; use flutter_secure_storage instead
rule:
  pattern: $P.setString($KEY, $V)
constraints:
  KEY:
    regex: '(?i)["''](password|token|apikey|api_key|secret|credential|auth|refresh_token|access_token)'
