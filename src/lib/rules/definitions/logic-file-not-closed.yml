id: logic-file-not-closed
language: Python
category: logic
severity: warning
message: open() result assigned without with-statement may leak file descriptors
rule:
  any:
    - pattern: f = open($$$)
    - pattern: fp = open($$$)
    - pattern: file = open($$$)
    - pattern: handle = open($$$)
    - pattern: fh = open($$$)
    - pattern: infile = open($$$)
    - pattern: outfile = open($$$)
