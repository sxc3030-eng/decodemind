id: logic-file-not-closed
language: Python
category: logic
severity: warning
message: open() without with-statement may leak file descriptors
rule:
  pattern:
    context: $VAR = open($URL)
    selector: assignment
# Uses `context + selector` so ast-grep can disambiguate the assignment.
# Note: also flags `with open(...) as f` if assigned outside the with — V2.2
# refinement: combine with `not.inside: { kind: with_statement }`.
