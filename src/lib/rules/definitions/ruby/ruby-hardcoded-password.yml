id: ruby-hardcoded-password
language: Ruby
category: security
severity: error
message: Hardcoded password or API key literal — move credentials to environment variables or Rails credentials
rule:
  pattern: $VAR = $VALUE
constraints:
  VAR:
    regex: '(?i)(password|passwd|secret|apikey|api_key|token)'
  VALUE:
    regex: '^"[^"]{4,}"$'
