id: php-hardcoded-password
language: PHP
category: security
severity: error
message: Hardcoded password/secret literal — move credentials to environment variables or a secrets manager
rule:
  pattern: $VAR = $VALUE;
  constraints:
    VAR:
      regex: '(?i)(password|passwd|secret|apikey|api_key|token)'
    VALUE:
      regex: '^[''"][^''"]{4,}[''"]$'
